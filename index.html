<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HISTORIA ANIMACJI — portal filmów animowanych</title>
<meta name="description" content="Światowa historia animacji w 430 filmach dostępnych na YouTube — 30 rozdziałów od zabawek optycznych (1833) po pokolenie internetu. Kanon z literatury: Bendazzi, Furniss, Sitkiewicz, Giżycki.">
<meta property="og:type" content="website">
<meta property="og:title" content="HISTORIA ANIMACJI — 430 filmów, 30 rozdziałów, 1833 → dziś">
<meta property="og:description" content="Światowa historia filmu animowanego do oglądania: od Plateau i Starewicza, przez Disneya i polską szkołę, po Pixara i pokolenie internetu. Plus tryb Maraton: wszystkie filmy po kolei.">
<meta property="og:image" content="https://futureshow1.github.io/futureshow/projects/historia-animacji/og-image.png">
<meta property="og:url" content="https://futureshow1.github.io/futureshow/projects/historia-animacji/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e13;
    --bg-card: #16151c;
    --bg-card-hover: #1d1c25;
    --bg-panel: rgba(15,14,19,.94);
    --ink: #f3efe6;
    --ink-dim: #b5b0a4;
    --ink-faint: #6f6b63;
    --acc: #ffb320;
    --acc-deep: #d18f0a;
    --line: #2a2833;
    --shadow: rgba(0,0,0,.55);
    --display: 'Archivo Black', 'Arial Black', sans-serif;
    --body: 'Space Grotesk', 'Helvetica Neue', sans-serif;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  body.light {
    --bg: #f5f0e4;
    --bg-card: #fcf9f0;
    --bg-card-hover: #ffffff;
    --bg-panel: rgba(245,240,228,.95);
    --ink: #17151c;
    --ink-dim: #55503f;
    --ink-faint: #8d8672;
    --acc: #c77800;
    --acc-deep: #9c5e00;
    --line: #ddd5c0;
    --shadow: rgba(60,50,30,.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.5;
    overflow-x: hidden;
    transition: background .3s, color .3s;
  }
  ::selection { background: var(--acc); color: #111; }

  /* ============ HEADER ============ */
  header {
    position: relative;
    padding: 5rem 4vw 3.5rem;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  /* perforacja taśmy filmowej */
  header::before {
    content: "";
    position: absolute;
    top: 0; right: 8vw;
    width: 26px; height: 100%;
    background:
      repeating-linear-gradient(to bottom,
        transparent 0 10px,
        var(--line) 10px 26px,
        transparent 26px 36px);
    opacity: .9;
    pointer-events: none;
  }
  header::after {
    content: "";
    position: absolute;
    top: 0; right: 14vw;
    width: 3px; height: 100%;
    background: var(--acc);
    transform: skewX(-16deg);
    opacity: .85;
    pointer-events: none;
  }
  .kicker {
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--acc);
    margin-bottom: 1.2rem;
  }
  h1 {
    font-family: var(--display);
    font-size: clamp(2.4rem, 8vw, 6.2rem);
    line-height: .92;
    text-transform: uppercase;
    letter-spacing: -.01em;
  }
  h1 span { display: block; white-space: nowrap; }
  h1 #titleTop { min-height: 1em; }
  h1 .stroke {
    color: transparent;
    -webkit-text-stroke: 2px var(--ink);
  }
  .lede {
    max-width: 600px;
    margin-top: 1.6rem;
    color: var(--ink-dim);
    font-weight: 300;
    font-size: 1.02rem;
  }
  .lede .src { font-size: .8rem; color: var(--ink-faint); display: block; margin-top: .6rem; }
  .stats {
    display: flex;
    gap: 2.8rem;
    margin-top: 2.4rem;
    font-family: var(--mono);
  }
  .stat b {
    display: block;
    font-size: 1.7rem;
    color: var(--acc);
    font-weight: 500;
  }
  .stat span {
    font-size: .68rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* ============ TOOLBAR ============ */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    gap: .8rem;
    align-items: center;
    padding: .9rem 4vw;
    background: var(--bg-panel);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav-dd { position: relative; }
  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: .6em;
    max-width: 340px;
    font-family: var(--mono);
    font-size: .72rem;
    letter-spacing: .06em;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: .58rem .9rem;
    cursor: pointer;
    transition: border-color .2s;
    white-space: nowrap;
  }
  .nav-btn:hover, .nav-dd.open .nav-btn { border-color: var(--acc); }
  .nav-btn .caret { color: var(--acc); font-size: .6rem; }
  .nav-btn .cur {
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 250px;
  }
  .nav-list {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: min(460px, 92vw);
    max-height: min(62vh, 540px);
    overflow-y: auto;
    background: var(--bg-panel);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    box-shadow: 0 18px 48px var(--shadow);
    z-index: 60;
  }
  .nav-dd.open .nav-list { display: block; }
  .nav-item {
    display: flex;
    gap: .7em;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: .72rem;
    line-height: 1.35;
    padding: .55rem .85rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .nav-item:last-child { border-bottom: none; }
  .nav-item b { color: var(--acc); font-weight: 500; flex-shrink: 0; }
  .nav-item .n { margin-left: auto; color: var(--ink-faint); flex-shrink: 0; }
  .nav-item:hover { background: var(--bg-card-hover); color: var(--ink); }
  .nav-item.active { color: var(--ink); background: var(--bg-card); box-shadow: inset 3px 0 0 var(--acc); }

  .search {
    flex: 1 1 200px;
    max-width: 380px;
    position: relative;
  }
  .search input {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: var(--mono);
    font-size: .85rem;
    padding: .6rem .9rem .6rem 2.2rem;
    outline: none;
    transition: border-color .2s;
  }
  .search input:focus { border-color: var(--acc); }
  .search::before {
    content: "◉";
    position: absolute;
    left: .8rem; top: 50%;
    transform: translateY(-50%);
    color: var(--acc);
    font-size: .8rem;
  }
  .filters { display: flex; gap: .4rem; }
  .fbtn, .tbtn {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: .55rem .9rem;
    cursor: pointer;
    transition: all .2s;
  }
  .fbtn:hover, .tbtn:hover { border-color: var(--ink-dim); color: var(--ink); }
  .fbtn.active { background: var(--acc); border-color: var(--acc); color: #17130a; }
  .tbtn { letter-spacing: .05em; }
  .result-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--ink-faint);
    letter-spacing: .1em;
  }

  /* ============ CHAPTER INDEX ============ */
  .chapter-index {
    padding: 2.2rem 4vw 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: .5rem .5rem;
  }
  .chip {
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--ink-dim);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: .4rem .7rem;
    transition: all .2s;
    display: inline-flex;
    gap: .5em;
    align-items: baseline;
    cursor: pointer;
    background: none;
  }
  .chip:hover { border-color: var(--acc); color: var(--ink); }
  .chip b { color: var(--acc); font-weight: 500; }

  /* ============ SECTIONS ============ */
  main { padding: 1rem 4vw 5rem; }
  section.chapter { padding-top: 3.6rem; }
  .chapter-head {
    display: flex;
    align-items: baseline;
    gap: 1.4rem;
    margin-bottom: .9rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1rem;
    position: relative;
    flex-wrap: wrap;
  }
  .chapter-head::after {
    content: "";
    position: absolute;
    left: 0; bottom: -1px;
    width: 72px; height: 3px;
    background: var(--acc);
  }
  .ch-num {
    font-family: var(--display);
    font-size: 2.2rem;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--acc);
    line-height: 1;
    flex-shrink: 0;
  }
  .ch-title {
    font-family: var(--body);
    font-weight: 700;
    font-size: clamp(1.05rem, 2.4vw, 1.55rem);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .ch-years {
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--acc);
    letter-spacing: .12em;
    white-space: nowrap;
  }
  .ch-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: .7rem;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .ch-blurb {
    max-width: 760px;
    margin-bottom: 1.8rem;
    color: var(--ink-dim);
    font-weight: 300;
    font-size: .92rem;
  }

  /* ============ GRID + CARDS ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1.2rem;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.3,1), border-color .25s, background .25s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--acc);
    background: var(--bg-card-hover);
  }
  .thumb {
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #000;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(.82);
    transition: filter .3s, transform .5s;
  }
  .card:hover .thumb img {
    filter: saturate(1.05);
    transform: scale(1.045);
  }
  .thumb::after {
    content: "▶";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 2rem;
    color: #fff;
    background: rgba(255,179,32,0);
    opacity: 0;
    transition: all .25s;
    text-shadow: 0 2px 18px rgba(0,0,0,.7);
  }
  .card:hover .thumb::after {
    opacity: 1;
    background: rgba(255,179,32,.16);
  }
  .dur {
    position: absolute;
    right: .5rem; bottom: .5rem;
    font-family: var(--mono);
    font-size: .65rem;
    background: rgba(0,0,0,.82);
    color: #f3efe6;
    padding: .15rem .45rem;
    letter-spacing: .05em;
    z-index: 2;
  }
  .badge {
    position: absolute;
    left: .5rem; top: .5rem;
    font-family: var(--mono);
    font-size: .58rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: .2rem .5rem;
    z-index: 2;
    background: var(--acc);
    color: #17130a;
  }
  .badge.frag { background: #8a6d1f; color: #fff; }
  .badge.doc { background: #3d5a80; color: #fff; }
  .card-body {
    padding: .9rem 1rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .3rem;
    flex: 1;
  }
  .f-artist {
    font-family: var(--mono);
    font-size: .64rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--acc);
  }
  .f-title {
    font-weight: 500;
    font-size: .98rem;
    line-height: 1.3;
  }
  .f-title .yr { color: var(--ink-faint); font-weight: 300; }
  .f-meta {
    margin-top: auto;
    padding-top: .5rem;
    font-family: var(--mono);
    font-size: .64rem;
    color: var(--ink-faint);
    letter-spacing: .06em;
    display: flex;
    gap: .8em;
  }

  /* ============ MODAL ============ */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8,7,10,.94);
    padding: 3vh 3vw;
  }
  .modal.open { display: flex; }
  .modal-inner {
    width: min(1100px, 96vw);
    max-height: 94vh;
    display: flex;
    flex-direction: column;
  }
  .player {
    aspect-ratio: 16/9;
    width: 100%;
    background: #000;
    border: 1px solid #2a2833;
    border-bottom: 3px solid var(--acc);
  }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .modal-meta {
    display: flex;
    align-items: baseline;
    gap: 1.2rem;
    flex-wrap: wrap;
    padding: 1.1rem .2rem;
  }
  .modal-meta .f-artist { font-size: .72rem; }
  .modal-meta .m-title {
    font-weight: 700;
    font-size: 1.3rem;
    width: 100%;
    color: #f3efe6;
  }
  .modal-meta .m-info {
    font-family: var(--mono);
    font-size: .7rem;
    color: #8d8672;
    display: flex;
    gap: 1.4em;
    flex-wrap: wrap;
  }
  .modal-meta a {
    color: #b5b0a4;
    text-decoration: none;
    border-bottom: 1px solid var(--acc);
  }
  .modal-meta a:hover { color: #f3efe6; }
  .close {
    position: fixed;
    top: 1.2rem; right: 1.6rem;
    font-family: var(--display);
    font-size: 1.6rem;
    color: #f3efe6;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 110;
    transition: color .2s, transform .2s;
  }
  .close:hover { color: var(--acc); transform: rotate(90deg); }

  /* ============ TO TOP ============ */
  .totop {
    position: fixed;
    right: 1.4rem; bottom: 1.4rem;
    z-index: 40;
    width: 2.9rem; height: 2.9rem;
    font-family: var(--display);
    font-size: 1.05rem;
    background: var(--bg-card);
    color: var(--acc);
    border: 1px solid var(--line);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, border-color .2s, transform .2s;
    box-shadow: 0 8px 24px var(--shadow);
  }
  .totop.show { opacity: 1; pointer-events: auto; }
  .totop:hover { border-color: var(--acc); transform: translateY(-3px); }

  /* ============ FOOTER ============ */
  footer {
    border-top: 1px solid var(--line);
    padding: 2.5rem 4vw 3rem;
    font-family: var(--mono);
    font-size: .68rem;
    color: var(--ink-faint);
    letter-spacing: .08em;
    line-height: 2;
  }
  footer b { color: var(--acc); font-weight: 500; }

  .empty-note {
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--ink-faint);
    padding: 1rem 0 2rem;
  }
  @media (max-width: 720px) {
    header { padding-top: 3rem; }
    .stats { gap: 1.6rem; }
    .result-count { display: none; }
    .nav-btn .cur { max-width: 120px; }
  }
</style>
</head>
<body>

<header>
  <div class="kicker" data-i18n="kicker"></div>
  <h1 aria-label="Historia Animacji — Animation History"><span id="titleTop">HISTORIA</span><span class="stroke" id="titleBot">ANIMACJI</span></h1>
  <p class="lede"><span data-i18n="lede"></span><span class="src" data-i18n="ledeSrc"></span></p>
  <div class="stats">
    <div class="stat"><b id="stat-films">0</b><span data-i18n="films"></span></div>
    <div class="stat"><b id="stat-artists">0</b><span data-i18n="artists"></span></div>
    <div class="stat"><b id="stat-chapters">0</b><span data-i18n="chapters"></span></div>
  </div>
</header>

<div class="toolbar">
  <div class="nav-dd" id="navDD">
    <button class="nav-btn" id="navBtn" aria-haspopup="true" aria-expanded="false">
      <span class="caret">▼</span><span class="cur" id="navCur"></span>
    </button>
    <div class="nav-list" id="navList" role="menu"></div>
  </div>
  <div class="search"><input id="q" type="search" autocomplete="off"></div>
  <div class="filters">
    <button class="fbtn active" data-type="all" data-i18n="fAll"></button>
    <button class="fbtn" data-type="full" data-i18n="fFull"></button>
    <button class="fbtn" data-type="fragment" data-i18n="fFrag"></button>
  </div>
  <button class="tbtn" id="themeBtn" title="motyw / theme">◐</button>
  <button class="tbtn" id="langBtn"></button>
  <div class="result-count" id="rcount"></div>
</div>

<nav class="chapter-index" id="chapterIndex"></nav>

<main id="main"></main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="close" id="closeBtn" aria-label="Zamknij">✕</button>
  <div class="modal-inner">
    <div class="player" id="player"></div>
    <div class="modal-meta" id="modalMeta"></div>
  </div>
</div>

<button class="totop" id="toTop" aria-label="Do góry">▲</button>

<footer id="foot"></footer>

<script src="data.js"></script>
<script>
// Rozdziały wyprowadzone z kanonu: Bendazzi (Animation: A World History), Furniss
// (A New History of Animation), Sitkiewicz (Polska szkoła animacji), Giżycki (Nie tylko Disney).
const SECTIONS = [
  { pl: "Prehistoria ruchomych obrazów", en: "Prehistory of the Moving Image", years: "1833–1900",
    bpl: "Zanim powstało kino, ruch trzeba było wymyślić: fenakistiskop Plateau, zoetrop, chronofotografie Muybridge'a i Mareya oraz Teatr Optyczny Émile'a Reynauda, w którym animacja była pokazywana publicznie na ekranie już w 1892 roku.",
    ben: "Before cinema, motion had to be invented: Plateau's phenakistiscope, the zoetrope, Muybridge's and Marey's chronophotography, and Émile Reynaud's Théâtre Optique, which projected animation for audiences as early as 1892." },
  { pl: "Pionierzy: Blackton, Cohl, McCay", en: "The Pioneers: Blackton, Cohl, McCay", years: "1900–1918",
    bpl: "Pierwsze filmy animowane sensu stricto: triki Blacktona, żywa kreska Émile'a Cohla i Winsor McCay, który w Gertie the Dinosaur dał animacji osobowość, a w Zatopieniu Lusitanii — powagę.",
    ben: "The first true animated films: Blackton's tricks, Émile Cohl's living line, and Winsor McCay, who gave animation personality in Gertie the Dinosaur and gravity in The Sinking of the Lusitania." },
  { pl: "Władysław Starewicz: narodziny animacji lalkowej", en: "Starewicz and the Birth of Puppet Animation", years: "1910–1958",
    bpl: "Urodzony w polskiej rodzinie pionier animacji lalkowej: od owadzich dramatów kręconych w Rosji po arcydzieła francuskiego okresu. Bendazzi nazywa go pierwszym wielkim autorem animacji.",
    ben: "Born to a Polish family, the pioneer of puppet animation: from insect dramas shot in Russia to the masterpieces of his French period. Bendazzi calls him animation's first great auteur." },
  { pl: "Amerykańska era niema: Felix, Koko i fabryki kreskówek", en: "The American Silent Era", years: "1915–1928",
    bpl: "Kot Felix Otto Messmera — pierwsza wielka gwiazda animacji — oraz przemysłowe studia Braya, Sullivana i Terry'ego, w których narodził się system produkcji kreskówek.",
    ben: "Otto Messmer's Felix the Cat — animation's first true star — and the industrial studios of Bray, Sullivan and Terry, where the cartoon production system was born." },
  { pl: "Bracia Fleischer: Betty Boop, Popeye, Superman", en: "The Fleischer Brothers", years: "1929–1942",
    bpl: "Nowojorska, surrealna i jazzowa alternatywa dla Disneya: Betty Boop z Cabem Callowayem, Popeye i monumentalny Superman. Rotoskop, setback i najdziwniejsze metamorfozy w historii kreskówki.",
    ben: "The New York alternative to Disney — surreal and jazz-soaked: Betty Boop with Cab Calloway, Popeye, and the monumental Superman. The rotoscope, the setback, and the strangest metamorphoses in cartoon history." },
  { pl: "Disney: od Myszki Miki do Fantazji", en: "Disney: Mickey to Fantasia", years: "1928–1942",
    bpl: "Dźwięk w Parowcu Willie, kolor w Flowers and Trees, iluzja życia w Starym młynie i skok w pełny metraż. Dekada, w której Disney zdefiniował, czym animacja miała być przez pół wieku.",

const films = (window.FILMS || []).filter(f => f && f.id);
let typeFilter = 'all';
let query = '';
let lang = localStorage.getItem('ha-lang') || 'pl';
let theme = localStorage.getItem('ha-theme') || 'dark';

const T = () => I18N[lang];
const S = sec => SECTIONS.find(s => s.pl === sec);
const secName = sec => { const s = S(sec); return s ? (lang === 'en' ? s.en : s.pl) : sec; };
const secBlurb = sec => { const s = S(sec); return s ? (lang === 'en' ? s.ben : s.bpl) : ''; };
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const fmtViews = v => {
  if (!v) return '';
  if (v >= 1e6) return (v/1e6).toFixed(1).replace('.0','') + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(0) + 'K';
  return String(v);
};
const pad2 = n => String(n).padStart(2, '0');

function matches(f) {
  if (typeFilter === 'full' && f.type !== 'full') return false;
  if (typeFilter === 'fragment' && f.type === 'full') return false;
  if (query) {
    const hay = norm(f.film + ' ' + f.artist + ' ' + (f.section || '') + ' ' + secName(f.section));
    if (!query.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function badgeFor(f) {
  if (f.type === 'fragment') return `<span class="badge frag">${T().badgeFrag}</span>`;
  if (f.type === 'documentary') return `<span class="badge doc">${T().badgeDoc}</span>`;
  return '';
}

function cardHTML(f, idx) {
  return `<article class="card" data-idx="${idx}" tabindex="0" role="button" aria-label="${f.film}">
    <div class="thumb">
      ${badgeFor(f)}
      ${f.source === 'vimeo'
        ? `<img loading="lazy" src="${f.thumbnail}" alt="${f.film}">`
        : `<img loading="lazy" src="https://i.ytimg.com/vi/${f.id}/hqdefault.jpg"
           onload="if(this.naturalWidth>120){const m=new Image();m.onload=()=>{if(m.naturalWidth>640)this.src=m.src};m.src='https://i.ytimg.com/vi/${f.id}/maxresdefault.jpg'}"
           alt="${f.film}">`}
      ${f.duration ? `<span class="dur">${f.duration}</span>` : ''}
    </div>
    <div class="card-body">
      <div class="f-artist">${f.artist}</div>
      <div class="f-title">${f.film}${f.year ? ` <span class="yr">(${f.year})</span>` : ''}</div>
      <div class="f-meta">
        ${f.views ? `<span>${fmtViews(f.views)} ${T().views}</span>` : ''}
        ${f.channel ? `<span>${f.channel}</span>` : ''}
      </div>
    </div>
  </article>`;
}

let visibleSections = []; // [{sec, si, anchor, num}]

function render() {
  const main = document.getElementById('main');
  const idxNav = document.getElementById('chapterIndex');
  const navList = document.getElementById('navList');
  let html = '', idxHtml = '', navHtml = '', shown = 0, chapters = 0;
  visibleSections = [];

  SECTIONS.forEach((secObj, si) => {
    const sec = secObj.pl;
    const secFilms = films.map((f, i) => ({...f, _i: i})).filter(f => f.section === sec && matches(f));
    if (!secFilms.length) return;
    chapters++;
    const anchor = 'ch' + si;
    const num = pad2(chapters);
    visibleSections.push({sec, si, anchor, num});
    const name = secName(sec);
    idxHtml += `<button class="chip" data-goto="${anchor}"><b>${num}</b> ${name}</button>`;
    navHtml += `<button class="nav-item" role="menuitem" data-goto="${anchor}" data-anchor="${anchor}"><b>${num}</b> ${name} <span class="n">${secFilms.length}</span></button>`;
    html += `<section class="chapter" id="${anchor}">
      <div class="chapter-head">
        <div class="ch-num">${num}</div>
        <div class="ch-title">${name}</div>
        <div class="ch-years">${secObj.years}</div>
        <div class="ch-count">${secFilms.length} ${T().countWord(secFilms.length)}</div>
      </div>
      <p class="ch-blurb">${secBlurb(sec)}</p>
      <div class="grid">${secFilms.map(f => cardHTML(f, f._i)).join('')}</div>
    </section>`;
    shown += secFilms.length;
  });

  main.innerHTML = html || `<p class="empty-note">${T().empty}</p>`;
  idxNav.innerHTML = idxHtml;
  navList.innerHTML = navHtml;
  document.getElementById('rcount').textContent = T().rcount(shown, films.length);
  updateSpy();
}

function applyI18n() {
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.getElementById('q').placeholder = t.search;
  document.getElementById('langBtn').textContent = t.langBtn;
  document.getElementById('foot').innerHTML = t.footer;
  render();
}

function openModal(f) {
  const modal = document.getElementById('modal');
  document.getElementById('player').innerHTML = f.noembed
    ? `<a href="${f.url}" target="_blank" rel="noopener" style="display:grid;place-items:center;width:100%;height:100%;text-decoration:none;background:url('https://i.ytimg.com/vi/${f.id}/hqdefault.jpg') center/cover;position:relative">
         <span style="font-family:var(--mono);font-size:.85rem;letter-spacing:.1em;background:rgba(15,14,19,.9);border:1px solid var(--acc);color:#f3efe6;padding:1rem 1.6rem">
           ${T().noembed}
         </span></a>`
    : f.source === 'vimeo'
      ? `<iframe src="https://player.vimeo.com/video/${f.id}?autoplay=1&dnt=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`
      : `<iframe src="https://www.youtube-nocookie.com/embed/${f.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
  document.getElementById('modalMeta').innerHTML = `
    <div class="m-title">${f.film}${f.year ? ` (${f.year})` : ''}</div>
    <div class="f-artist">${f.artist}</div>
    <div class="m-info">
      ${f.duration ? `<span>⏱ ${f.duration}</span>` : ''}
      ${f.views ? `<span>${fmtViews(f.views)} ${T().viewsLong}</span>` : ''}
      ${f.channel ? `<span>${T().channel}: ${f.channel}</span>` : ''}
      <a href="${f.url}" target="_blank" rel="noopener">${f.source === 'vimeo' ? T().open.replace('YouTube', 'Vimeo') : T().open}</a>
    </div>`;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('player').innerHTML = '';
  document.body.style.overflow = '';
}

// ---- scroll spy ----
function updateSpy() {
  const t = T();
  let current = null;
  for (const vs of visibleSections) {
    const el = document.getElementById(vs.anchor);
    if (el && el.getBoundingClientRect().top <= 140) current = vs;
    else break;
  }
  const cur = document.getElementById('navCur');
  cur.textContent = current ? `${current.num} · ${secName(current.sec)}` : `${t.navLabel} (${visibleSections.length})`;
  document.querySelectorAll('.nav-item').forEach(it => {
    it.classList.toggle('active', !!current && it.dataset.anchor === current.anchor);
  });
  document.getElementById('toTop').classList.toggle('show', window.scrollY > 700);
}
let spyTick = false;
window.addEventListener('scroll', () => {
  if (spyTick) return;
  spyTick = true;
  requestAnimationFrame(() => { updateSpy(); spyTick = false; });
}, {passive: true});

// ---- events ----
document.addEventListener('click', e => {
  const goto = e.target.closest('[data-goto]');
  if (goto) {
    document.getElementById('navDD').classList.remove('open');
    document.getElementById(goto.dataset.goto)?.scrollIntoView({behavior: 'smooth'});
    return;
  }
  if (e.target.closest('#navBtn')) {
    const dd = document.getElementById('navDD');
    dd.classList.toggle('open');
    document.getElementById('navBtn').setAttribute('aria-expanded', dd.classList.contains('open'));
    if (dd.classList.contains('open')) {
      const act = dd.querySelector('.nav-item.active');
      if (act) act.scrollIntoView({block: 'center'});
    }
    return;
  }
  if (!e.target.closest('.nav-dd')) document.getElementById('navDD').classList.remove('open');
  const card = e.target.closest('.card');
  if (card) { openModal(films[+card.dataset.idx]); return; }
  if (e.target.id === 'modal' || e.target.id === 'closeBtn') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); document.getElementById('navDD').classList.remove('open'); }
  if (e.key === 'Enter' && document.activeElement?.classList.contains('card'))
    openModal(films[+document.activeElement.dataset.idx]);
});
document.getElementById('q').addEventListener('input', e => { query = norm(e.target.value.trim()); render(); });
document.querySelectorAll('.fbtn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  typeFilter = b.dataset.type;
  render();
}));
document.getElementById('toTop').addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));
document.getElementById('themeBtn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ha-theme', theme);
  document.body.classList.toggle('light', theme === 'light');
});
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'pl' ? 'en' : 'pl';
  localStorage.setItem('ha-lang', lang);
  applyI18n();
});

// ---- morfujący tytuł: HISTORIA/ANIMACJI <-> ANIMATION/A HISTORY ----
(function(){
  const top = document.getElementById('titleTop');
  const bot = document.getElementById('titleBot');
  if (!top || !bot) return;
  const TITLES = [ {t:'HISTORIA', b:'ANIMACJI'}, {t:'ANIMATION', b:'A HISTORY'} ];
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZĄĆĘŁŃÓŚŹŻ▚▞█/·-';
  const rnd = () => CHARS[(Math.random()*CHARS.length)|0];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const HOLD = 2800, MORPH = 900;
  const render = (target, p) => {
    const locked = Math.floor(p*p*target.length);
    let s = '';
    for (let k=0;k<target.length;k++){
      const ch = target[k];
      s += (k < locked || ch === ' ' || ch === '-') ? ch : rnd();
    }
    return s;
  };
  let i = 0, phase = 'hold', phaseStart = performance.now(), to = TITLES[0];
  top.textContent = TITLES[0].t; bot.textContent = TITLES[0].b;
  setInterval(() => {
    const now = performance.now(), el = now - phaseStart;
    if (phase === 'hold') {
      if (el >= HOLD) { phase = 'morph'; phaseStart = now; i = (i+1) % TITLES.length; to = TITLES[i]; }
    } else {
      const p = Math.min(1, el / MORPH);
      top.textContent = render(to.t, p);
      bot.textContent = render(to.b, p);
      if (p >= 1) { top.textContent = to.t; bot.textContent = to.b; phase = 'hold'; phaseStart = now; }
    }
  }, 45);
})();

// ---- init ----
document.body.classList.toggle('light', theme === 'light');
document.getElementById('stat-films').textContent = films.length;
document.getElementById('stat-artists').textContent = new Set(films.map(f => f.artist)).size;
document.getElementById('stat-chapters').textContent = new Set(films.map(f => f.section)).size;
applyI18n();
</script>
